# nginx na frente do career-scout: senha (Basic Auth) + limite nas rotas que raspam o Transfermarkt.
# Uso (Docker, rede do host):
#   docker run -d --name career-scout-nginx --network host --restart unless-stopped \
#     -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro" \
#     -v "$HOME/.config/career-scout/htpasswd:/etc/nginx/htpasswd:ro" nginx:alpine
# O app deve ouvir só em 127.0.0.1:8000 (fastapi run --host 127.0.0.1), senão dá para contornar a senha.
worker_processes 1;
events { worker_connections 256; }

http {
    server_tokens off;
    # /overview e /scout podem disparar scraping do TM a partir do IP do host.
    # ponytail: limite por IP do cliente; atrás de túnel todo mundo vira 127.0.0.1 e o limite fica global (o que protege o TM do mesmo jeito)
    limit_req_zone $binary_remote_addr zone=scrape:10m rate=6r/m;
    limit_req_status 429;

    server {
        listen 80;
        auth_basic "Career Scout";
        auth_basic_user_file /etc/nginx/htpasswd;
        client_max_body_size 16k;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~ ^/(overview|scout)$ {
            limit_req zone=scrape burst=10 nodelay;
            proxy_read_timeout 300s;   # primeira consulta de um clube raspa várias temporadas
            proxy_pass http://127.0.0.1:8000;
        }
        location / {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
