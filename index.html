<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Scout</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0f1117;
    --surface: #1a1d27;
    --border:  #2a2d3a;
    --text:    #e2e4ed;
    --muted:   #6b7080;
    --green:   #22c55e;
    --yellow:  #eab308;
    --blue:    #3b82f6;
    --red:     #ef4444;
    --purple:  #a855f7;
  }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; font-size:14px; line-height:1.5; min-height:100vh; }
  header { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 24px; display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; }
  header span { color:var(--green); }
  main { max-width:1200px; margin:0 auto; padding:24px 16px; display:flex; flex-direction:column; gap:20px; }

  /* Form */
  .form-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:20px 20px 16px; }
  .form-steps { display:flex; flex-wrap:wrap; gap:28px; align-items:flex-end; }
  .step { display:flex; flex-direction:column; gap:4px; position:relative; }
  .step + .step::before { content:'›'; position:absolute; left:-14px; bottom:9px; color:var(--border); font-size:18px; }
  .step label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .step-num { background:var(--border); color:var(--muted); border-radius:50%; width:16px; height:16px; font-size:10px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .step.active .step-num { background:var(--green); color:#000; }
  .step.active label { color:var(--text); }
  select, input[type=number] { background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:7px 10px; font-size:14px; min-width:160px; }
  select:disabled, input:disabled { opacity:.4; cursor:not-allowed; }
  select:focus, input:focus { outline:2px solid var(--blue); outline-offset:1px; }
  input[type=number] { min-width:80px; max-width:100px; }
  .form-footer { margin-top:16px; padding-top:16px; border-top:1px solid var(--border); display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .form-footer label { display:flex; flex-direction:column; gap:4px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  button { background:var(--green); color:#000; border:none; border-radius:6px; padding:8px 22px; font-weight:700; font-size:14px; cursor:pointer; }
  button:hover:not(:disabled) { filter:brightness(1.1); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .hint { font-size:12px; color:var(--muted); }
  .info { cursor:help; color:var(--blue); text-transform:none; }

  /* Status */
  .status-bar { padding:12px 16px; border-radius:6px; display:none; }
  .status-bar.loading { background:#1e2a1a; border:1px solid var(--green); color:var(--green); }
  .status-bar.error   { background:#2a1a1a; border:1px solid var(--red);   color:var(--red); }
  .spinner { display:inline-block; width:12px; height:12px; border:2px solid var(--green); border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite; margin-right:8px; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Cards genéricos */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .card-header { padding:12px 16px; background:#1f2232; border-bottom:1px solid var(--border); font-weight:600; font-size:13px; display:flex; align-items:center; gap:8px; }
  .card-body { padding:16px; }

  /* Stat chips */
  .chips { display:flex; flex-wrap:wrap; gap:10px; }
  .chip { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 14px; }
  .chip .label { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .chip .value { font-size:18px; font-weight:700; }
  .chip .value.green  { color:var(--green); }
  .chip .value.yellow { color:var(--yellow); }
  .chip .value.blue   { color:var(--blue); }
  .chip .value.purple { color:var(--purple); }

  /* Dist grid */
  .dist-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
  .dist-block h4 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px; }
  .dist-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:12px; }
  .dist-row .bar { flex:1; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  .dist-row .fill { height:100%; background:var(--blue); border-radius:2px; }
  .dist-row .key { min-width:120px; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
  .dist-row .n   { color:var(--muted); min-width:24px; text-align:right; }

  /* Tables */
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:8px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:7px 12px; border-bottom:1px solid #1e2030; white-space:nowrap; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#1f2232; }

  /* Badges */
  .badge { display:inline-block; padding:1px 7px; border-radius:4px; font-size:11px; font-weight:700; }
  .badge-pos  { background:var(--green);  color:#000; }
  .badge-pos-gk  { background:var(--yellow); color:#000; }
  .badge-pos-def { background:var(--blue);   color:#000; }
  .badge-pos-mid { background:var(--green);  color:#000; }
  .badge-pos-att { background:var(--red);    color:#fff; }
  .badge-freq { background:var(--yellow); color:#000; }
  .badge-perm { background:#1e3a2a; color:var(--green); border:1px solid #2a5a3a; }
  .badge-loan { background:#1e2a3a; color:var(--blue);  border:1px solid #2a3a5a; }
  .badge-free { background:#2a2a1e; color:var(--yellow); border:1px solid #4a4a2a; }

  /* Score bar */
  .score-bar { display:flex; align-items:center; gap:6px; min-width:80px; }
  .score-bar .bar { flex:1; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  .score-bar .fill { height:100%; background:var(--green); border-radius:2px; }
  .score-bar .val  { font-size:11px; color:var(--muted); min-width:28px; }

  .ovr { font-weight:700; }
  .ovr.high { color:var(--green); }
  .ovr.mid  { color:var(--yellow); }
  .ovr.low  { color:var(--muted); }

  .muted { color:var(--muted); }
  .trunc { max-width:150px; overflow:hidden; text-overflow:ellipsis; }

  /* Modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-overlay.hidden { display:none; }
  .modal-box { background:var(--surface); border:1px solid var(--border); border-radius:10px; width:min(480px,90vw); max-height:80vh; display:flex; flex-direction:column; }
  .modal-box.wide { width:min(1100px,95vw); max-height:88vh; }
  .modal-head { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; font-weight:600; }
  .modal-close { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:0 4px; line-height:1; }
  .modal-close:hover { color:var(--text); }
  .modal-body { overflow-y:auto; padding:16px; }

  /* Resultados: navegação por posição (sticky) */
  #results { display:flex; flex-direction:column; gap:20px; }
  .pos-nav { position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; gap:6px; padding:10px 0; background:var(--bg); }
  .pos-nav a { text-decoration:none; padding:3px 10px; font-size:12px; }
  #results .card { scroll-margin-top:52px; }

  table.sortable th { cursor:pointer; user-select:none; }
  table.sortable th:hover { color:var(--text); }
  table.sortable th[data-dir=desc]::after { content:' ▼'; }
  table.sortable th[data-dir=asc]::after  { content:' ▲'; }

  /* "ver todas" link */
  .see-all { display:inline-block; margin-top:8px; font-size:11px; color:var(--blue); cursor:pointer; }
  .see-all:hover { text-decoration:underline; }
</style>
</head>
<body>
<header><span>⬡</span> Career Scout
  <select id="sel-lang" onchange="setLang(this.value)" aria-label="Idioma / Language" style="margin-left:auto;min-width:0;font-weight:400">
    <option value="pt">🇧🇷 Português</option>
    <option value="en">🇬🇧 English</option>
    <option value="es">🇪🇸 Español</option>
  </select>
</header>
<main>

  <!-- Formulário -->
  <div class="form-card">
    <div class="form-steps">
      <div class="step active" id="step-edition">
        <label><span class="step-num">1</span><span data-i18n="step_edition"></span></label>
        <select id="sel-edition" onchange="onEditionChange()"><option value="" data-i18n="loading"></option></select>
      </div>
      <div class="step" id="step-country">
        <label><span class="step-num">2</span><span data-i18n="step_country"></span></label>
        <select id="sel-country" disabled onchange="onCountryChange()"><option value="" data-i18n="pick_edition"></option></select>
      </div>
      <div class="step" id="step-league">
        <label><span class="step-num">3</span><span data-i18n="step_league"></span></label>
        <select id="sel-league" disabled onchange="onLeagueChange()"><option value="" data-i18n="pick_country"></option></select>
      </div>
      <div class="step" id="step-club">
        <label><span class="step-num">4</span><span data-i18n="step_club"></span></label>
        <select id="sel-club" disabled onchange="onClubChange()"><option value="" data-i18n="pick_league"></option></select>
      </div>
    </div>
    <div class="form-footer">
      <label><span><span data-i18n="hist"></span> <span class="info" data-i18n-title="hist_tip">ⓘ</span></span><input type="number" id="inp-history" value="5" min="2" max="15" disabled onchange="loadOverview()"></label>
      <label><span><span data-i18n="topn"></span> <span class="info" data-i18n-title="topn_tip">ⓘ</span></span><input type="number" id="inp-topn" value="20" min="5" max="50" disabled></label>
      <label><span><span data-i18n="pot"></span> <span class="info" data-i18n-title="pot_tip">ⓘ</span></span><select id="sel-potential" disabled>
        <option value="0" data-i18n="off"></option>
        <option value="0.15" data-i18n="low"></option>
        <option value="0.3" data-i18n="mid"></option>
        <option value="0.5" data-i18n="high"></option>
      </select></label>
      <label><span><span data-i18n="realism"></span> <span class="info" data-i18n-title="realism_tip">ⓘ</span></span><select id="sel-realism" disabled onchange="onRealismChange()">
        <option value="0" data-i18n="off"></option>
        <option value="1" data-i18n="on"></option>
      </select></label>
      <label class="realism-only" style="display:none"><span><span data-i18n="level"></span> <span class="info" data-i18n-title="level_tip">ⓘ</span></span><select id="sel-level">
        <option value="0" data-i18n="lvl_same"></option>
        <option value="3" data-i18n="lvl_up"></option>
        <option value="-3" data-i18n="lvl_cheap"></option>
      </select></label>
      <label class="realism-only" style="display:none"><span><span data-i18n="sort"></span> <span class="info" data-i18n-title="sort_tip">ⓘ</span></span><select id="sel-sort">
        <option value="score" data-i18n="sort_score"></option>
        <option value="overall" data-i18n="sort_ovr"></option>
      </select></label>
      <label class="realism-only" style="display:none"><span><span data-i18n="rol"></span> <span class="info" data-i18n-title="rol_tip">ⓘ</span></span><select id="sel-rol">
        <option value="0.6" data-i18n="rol_strict"></option>
        <option value="0.45" selected data-i18n="rol_mid"></option>
        <option value="0.3" data-i18n="rol_wide"></option>
      </select></label>
      <button id="btn-scout" disabled onclick="runScout()" data-i18n="btn_scout"></button>
      <span class="hint" id="hint"></span>
    </div>
  </div>

  <!-- Modal reutilizável -->
  <div id="modal" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal-box" id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <span id="modal-title"></span>
        <button class="modal-close" id="modal-close" data-i18n-aria="close" onclick="hideModal()">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="status-overview" class="status-bar"></div>
  <div id="overview"></div>
  <div id="status-scout"   class="status-bar"></div>
  <div id="results"></div>

</main>

const LOCALE = { pt: 'pt-BR', en: 'en', es: 'es' };
let LANG = (() => { try { return localStorage.getItem('lang'); } catch { return null; } })();
if (!I18N[LANG]) LANG = { en: 'en', es: 'es' }[navigator.language.slice(0, 2)] || 'pt';

function t(key, vars = {}) {
  const s = I18N[LANG][key] ?? I18N.pt[key] ?? key;  // chave desconhecida ("OVR", "#") passa direto
  return s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
}
// t() para templates HTML: escapa o texto e as variáveis (nome do clube vem dos dados)
function tr(key, vars = {}) {
  return esc(t(key, vars));
}
function thead(...keys) {
  return `<tr>${keys.map(k => `<th>${k ? esc(t(k)) : ''}</th>`).join('')}</tr>`;
}

// Países: nomes vêm em inglês (SoFIFA/TM). Tradução nativa via Intl.DisplayNames,
// que precisa do código ISO — o mapa nome→código é montado do próprio Intl em inglês.
const COUNTRY_ISO_ALIAS = {
  'Bonaire': 'BQ', 'Brunei Darussalam': 'BN', 'Cabo Verde': 'CV', 'Cape Verde Islands': 'CV', 'China PR': 'CN',
  'Chinese Taipei': 'TW', 'Congo': 'CG', 'Congo DR': 'CD', 'DR Congo': 'CD', 'Czech Republic': 'CZ', 'Guinea Bissau': 'GW',
  'Hong Kong': 'HK', 'Korea DPR': 'KP', 'Korea Republic': 'KR', 'Korea, South': 'KR', 'Korea, North': 'KP',
  'Kyrgyz Republic': 'KG', 'Macau': 'MO', 'Palestine': 'PS', 'Republic of Ireland': 'IE', 'Saint Kitts and Nevis': 'KN',
  'Saint Lucia': 'LC', 'Saint Vincent and the Grenadines': 'VC', 'Sint Maarten (Dutch part)': 'SX', 'Swaziland': 'SZ',
  'São Tomé e Príncipe': 'ST', 'Turkey': 'TR', 'Türkiye': 'TR', 'UAE': 'AE', 'USA': 'US', 'Bosnia-Herzegovina': 'BA',
};
// sem código ISO de país (nações do Reino Unido) + o "Outros" do backend
const COUNTRY_NON_ISO = {
  'England':          { pt: 'Inglaterra',       en: 'England',          es: 'Inglaterra' },
  'Scotland':         { pt: 'Escócia',          en: 'Scotland',         es: 'Escocia' },
  'Wales':            { pt: 'País de Gales',    en: 'Wales',            es: 'Gales' },
  'Northern Ireland': { pt: 'Irlanda do Norte', en: 'Northern Ireland', es: 'Irlanda del Norte' },
  'Outros':           { pt: 'Outros',           en: 'Others',           es: 'Otros' },
};
const _normCountry = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’`]/g, "'").replace(/&/g, 'and').toLowerCase();
let _isoByName = null;
const _regionNames = {};
function countryName(name) {
  if (!name) return name;
  if (COUNTRY_NON_ISO[name]) return COUNTRY_NON_ISO[name][LANG];
  if (!_isoByName) {
    _isoByName = {};
    const en = new Intl.DisplayNames(['en'], { type: 'region' }), A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    for (const a of A) for (const b of A) {
      const n = en.of(a + b);
      if (n && n !== a + b) _isoByName[_normCountry(n)] = a + b;
    }
  }
  const code = COUNTRY_ISO_ALIAS[name] || _isoByName[_normCountry(name)];
  if (!code) return name;  // desconhecido: mostra como veio
  _regionNames[LANG] ??= new Intl.DisplayNames([LOCALE[LANG]], { type: 'region' });
  return _regionNames[LANG].of(code) || name;
}

function applyI18n() {
  document.documentElement.lang = LOCALE[LANG];
  document.getElementById('sel-lang').value = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('#sel-country option').forEach(o => { if (o.value) o.textContent = countryName(o.value); });
}

async function init() {
  const years = await fetch('/fifa-years').then(r => r.json());
  const sel = document.getElementById('sel-edition');
  if (!years.length) {
    reset('sel-edition', 'no_data', false);
    setStatus('status-overview', 'error', t('no_data_msg', { link:
      '<a href="https://github.com/guigasauro/career-scout#dados-do-sofifa-não-inclusos" target="_blank">README → SoFIFA</a>' }));
    return;
  }
  reset('sel-edition', 'select', false);
  [...years].reverse().forEach(y => {
    const o = new Option(edLabel(y), y);
    sel.appendChild(o);
  });
  await restoreFromUrl();

// ── estado na URL (?ed=22&club=583…) — recarregar/compartilhar mantém a busca ──
const URL_FIELDS = {
  ed: 'sel-edition', country: 'sel-country', league: 'sel-league',
  hist: 'inp-history', top: 'inp-topn', pot: 'sel-potential',
  real: 'sel-realism', lvl: 'sel-level', sort: 'sel-sort', rol: 'sel-rol',
};
function saveUrl(run = false) {
  const q = new URLSearchParams();
  for (const [k, id] of Object.entries(URL_FIELDS)) {
    const v = document.getElementById(id).value;
    if (v) q.set(k, v);
  }
  if (selectedClub) q.set('club', selectedClub.id);
  if (run) q.set('run', '1');
  const qs = q.toString();
  window.history.replaceState(null, '', qs ? '?' + qs : location.pathname);
}
async function restoreFromUrl() {
  const q = new URLSearchParams(location.search);
  const set = k => { if (q.has(k)) document.getElementById(URL_FIELDS[k]).value = q.get(k); };
  ['hist', 'top', 'pot', 'real', 'lvl', 'sort', 'rol'].forEach(set);
  onRealismChange();
  if (!q.has('ed')) return;
  set('ed');      await onEditionChange();
  if (!q.has('country')) return;
  set('country'); await onCountryChange();
  if (!q.has('league')) return;
  set('league');  await onLeagueChange();
  const sel = document.getElementById('sel-club');
  const opt = [...sel.options].find(o => o.value && String(JSON.parse(o.value).id) === q.get('club'));
  if (!opt) return;
  sel.value = opt.value;
  await onClubChange();
  if (q.get('run')) runScout();
}
// qualquer mudança no formulário regrava a URL (e derruba o run=1)
document.querySelector('.form-card').addEventListener('change', () => saveUrl());

// ── cascata de selects ────────────────────────────────────────────
async function onEditionChange() {
  const edition = document.getElementById('sel-edition').value;
  reset('sel-country', 'pick_edition', true);
  reset('sel-league',  'pick_country', true);
  reset('sel-club',    'pick_league',  true);
  setStep('step-country', false); setStep('step-league', false); setStep('step-club', false);
  lockFooter(); clearOverview(); selectedClub = null;
  if (!edition) return;

  const ctrs = await fetch(`/countries?edition=${edition}`).then(r => r.json());
  const sel = document.getElementById('sel-country');
  reset('sel-country', 'select', false);
  // valor fica em inglês (é o que a API espera); só o rótulo é traduzido
  ctrs.map(c => [countryName(c), c]).sort(([a], [b]) => a.localeCompare(b, LOCALE[LANG]))
      .forEach(([label, c]) => sel.appendChild(new Option(label, c)));
  sel.disabled = false; setStep('step-country', true);
}

async function onCountryChange() {
  const edition = document.getElementById('sel-edition').value;
  const country = document.getElementById('sel-country').value;
  reset('sel-league', 'pick_country', true);
  reset('sel-club',   'pick_league',  true);
  setStep('step-league', false); setStep('step-club', false);
  lockFooter(); clearOverview(); selectedClub = null;
  if (!country) return;

  const leagues = await fetch(`/leagues?edition=${edition}&country=${encodeURIComponent(country)}`).then(r => r.json());
  const sel = document.getElementById('sel-league');
  reset('sel-league', 'select', false);
  leagues.forEach(l => sel.appendChild(new Option(l, l)));
  sel.disabled = false; setStep('step-league', true);
}

async function onLeagueChange() {
  const league = document.getElementById('sel-league').value;
  reset('sel-club', 'pick_league', true);
  setStep('step-club', false); lockFooter(); clearOverview(); selectedClub = null;
  if (!league) return;

  const clubs = await fetch(`/clubs?league=${encodeURIComponent(league)}`).then(r => r.json());
  const sel = document.getElementById('sel-club');
  if (!clubs.length) {
    reset('sel-club', 'no_clubs', true);
    setHint('hint_unmapped');
    return;
  }
  reset('sel-club', 'select', false);
  clubs.forEach(c => sel.appendChild(new Option(c.name, JSON.stringify(c))));
  sel.disabled = false; setStep('step-club', true);
  setHint(null);
}

async function onClubChange() {
  const val = document.getElementById('sel-club').value;
  selectedClub = val ? JSON.parse(val) : null;
  lockFooter(); clearOverview();
  if (!selectedClub) return;
  document.getElementById('inp-history').disabled  = false;
  document.getElementById('inp-topn').disabled     = false;
  document.getElementById('sel-potential').disabled = false;
  document.getElementById('sel-realism').disabled  = false;
  document.getElementById('btn-scout').disabled    = false;
  await loadOverview();
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(v, dec = 1) {
  if (v == null) return '—';
  if (v >= 1e6) return `€${(v/1e6).toFixed(dec)}M`;
  if (v >= 1e3) return `€${(v/1e3).toFixed(0)}K`;
  return `€${v}`;
}
function edLabel(y) { return y >= 24 ? `EA FC ${y}` : `FIFA ${y}`; }
function fmtAge(v) { return v != null ? `${v}` : '—'; }
function pct(v, total) { return total ? Math.round(v / total * 100) : 0; }
function arrivalRowHtml(t) {

function posBadge(pos, isFreq) {
  if (isFreq) return 'badge-freq';
  const p = pos || '';
  if (p === 'GK') return 'badge-pos-gk';
  if (['CB','LB','RB','LWB','RWB'].includes(p)) return 'badge-pos-def';
  if (['CDM','CM','CAM','LM','RM'].includes(p)) return 'badge-pos-mid';
  if (['LW','RW','CF','ST','ATT'].includes(p)) return 'badge-pos-att';
  if (['DEF'].includes(p)) return 'badge-pos-def';
  if (['MID'].includes(p)) return 'badge-pos-mid';
  return 'badge-pos';
}
function typeLabel(t) {
  if (t === 'permanent') return `<span class="badge badge-perm">${tr('type_perm')}</span>`;
  if (t === 'loan')      return `<span class="badge badge-loan">${tr('type_loan')}</span>`;
  return `<span class="badge badge-free">${tr('type_free')}</span>`;
}
function seasonLabel(y) { return `${y}/${String(Number(y)+1).slice(2)}`; }  // 2012 → "2012/13"
function arrivalDate(t) {
  // TM agrega Summer+Winter por temporada; só a temporada é conhecida.
  return seasonLabel(t.season);
}
function countBy(arr, fn) {
  const c = {};
  arr.forEach(x => { const k = fn(x); if (k) c[k] = (c[k] || 0) + 1; });
  return c;
}

// ── ordenação por cabeçalho (table.sortable) ─────────────────────
function cellKey(td) {
  // "€10.5M" → 10500000, "€500K" → 500000, "85%" → 85, "2019/20" → 2019; resto vira texto
  const m = td.textContent.trim().match(/^€?(-?\d+(?:\.\d+)?)\s*([MK]?)/);
  return m ? parseFloat(m[1]) * ({ M: 1e6, K: 1e3 }[m[2]] || 1) : td.textContent.trim().toLowerCase();
}
document.addEventListener('click', e => {
  const th = e.target.closest('table.sortable th');
  if (!th || !th.textContent.trim()) return;
  const tbody = th.closest('table').tBodies[0], i = th.cellIndex;
  const dir = th.dataset.dir === 'desc' ? 'asc' : 'desc';  // 1º clique: maior primeiro
  th.parentElement.querySelectorAll('th').forEach(h => delete h.dataset.dir);
  th.dataset.dir = dir;
  const sign = dir === 'asc' ? 1 : -1;
  const rows = [...tbody.rows].map(r => [cellKey(r.cells[i]), r]);
  rows.sort(([a], [b]) => {
    const na = typeof a === 'number', nb = typeof b === 'number';
    if (na !== nb) return na ? -1 : 1;  // "—" sempre no fim
    return sign * (na ? a - b : a.localeCompare(b));
  });
  rows.forEach(([, r]) => tbody.appendChild(r));
});

async function loadOverview() {
  const edition = parseInt(document.getElementById('sel-edition').value);
  const history = parseInt(document.getElementById('inp-history').value);
  document.getElementById('results').innerHTML = '';
  setStatus('status-overview', 'loading', `<span class="spinner"></span>${t('loading_overview')}`);

  try {
    const res = await fetch('/overview', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        club_id: selectedClub.id, club_slug: selectedClub.slug,
        club_name: selectedClub.name, fifa_edition: edition, history, top_n: 20,
      }),
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || res.statusText); }
    const d = await res.json();
    window._overviewData = d; d._history = history;
    setStatus('status-overview', '');
    document.getElementById('overview').innerHTML = renderSimplePanel(d, history);
  } catch(e) {
    setStatus('status-overview', 'error', `${t('error')}: ${esc(e.message)}`);
  }

function distRows(obj, barColor = 'var(--blue)') {
  const max = Math.max(...Object.values(obj));
  return Object.entries(obj).map(([k, v]) => {
    const w = Math.round(v / max * 100);
    return `<div class="dist-row">
      <span class="key" title="${esc(k)}">${esc(k)}</span>
      <div class="bar"><div class="fill" style="width:${w}%;background:${barColor}"></div></div>
      <span class="n">${v}</span>
    </div>`;
  }).join('');
}

const _dists = [];
function distBlock(title, obj, total, barColor, limit = 5) {
  const entries = Object.entries(obj);
  const top     = Object.fromEntries(entries.slice(0, limit));
  const hasMore = entries.length > limit;
  // dados ficam num registro; inline JSON no onclick quebrava com apóstrofo ("Côte d'Ivoire")
  const idx = _dists.push([title, obj, barColor]) - 1;
  const seeAll  = hasMore
    ? `<span class="see-all" role="button" tabindex="0" onclick="openModal(..._dists[${idx}])">${t('see_all', { n: entries.length })}</span>`
    : '';
  return `<div class="dist-block"><h4>${esc(title)}</h4>${distRows(top, barColor)}${seeAll}</div>`;
}

// traduz as chaves (nomes de país) de um {país: n}
function countryKeys(obj) {
  const out = {};
  for (const [k, v] of Object.entries(obj || {})) { const n = countryName(k); out[n] = (out[n] || 0) + v; }
  return out;
}
function modeKey(obj) { const k = Object.keys(obj || {}); return k.length ? k[0] : null; }

function renderSimplePanel(d, history) {
  const f = d.fee_stats, a = d.age_stats;
  const perSeason = history ? (d.total / history).toFixed(1) : '—';
  const natMode    = modeKey(d.by_nationality);

    <div class="chip"><div class="label">${tr('c_league_mode')}</div><div class="value">${esc(leagueMode || '—')}</div></div>
    <div class="chip"><div class="label">${tr('c_age_mean')}</div><div class="value">${a.mean ?? '—'}</div></div>
    <div class="chip"><div class="label">${tr('c_fee_mean')}</div><div class="value blue">${fmt(f.mean)}</div></div>
    <div class="chip"><div class="label">${tr('c_fee_max')}</div><div class="value purple">${fmt(f.max)}</div></div>
  </div>`;
  return `<div class="card">
    <div class="card-header" style="justify-content:space-between">
      <span>📊 ${tr('overview_title', { club: d.club, ed: edLabel(d.fifa_edition) })}</span>
      <span class="see-all" role="button" tabindex="0" style="margin:0" onclick="openOverviewModal()">${tr('see_details')}</span>
    </div>
    <div class="card-body">${chips}</div>
  </div>`;
}

function renderOverviewFull(d) {
  const f = d.fee_stats, a = d.age_stats, total = d.total;

  const chips = `<div class="chips">
    <div class="chip"><div class="label">${tr('c_total')}</div><div class="value">${total}</div></div>
    <div class="chip"><div class="label">${tr('c_perm')}</div><div class="value green">${d.n_permanent}</div></div>
    <div class="chip"><div class="label">${tr('c_loan')}</div><div class="value blue">${d.n_loan}</div></div>
    <div class="chip"><div class="label">${tr('c_free')}</div><div class="value yellow">${d.n_free}</div></div>
    <div class="chip"><div class="label">${tr('c_fee_perm')}</div><div class="value">${fmt(f.perm_mean)}</div></div>
    <div class="chip"><div class="label">${tr('c_fee_max')}</div><div class="value">${fmt(f.max)}</div></div>
    <div class="chip"><div class="label">${tr('c_spent')}</div><div class="value purple">${fmt(f.total)}</div></div>
    <div class="chip"><div class="label">${tr('c_age_mean')}</div><div class="value">${a.mean ?? '—'}</div></div>
    <div class="chip"><div class="label">${tr('c_age_range')}</div><div class="value">${a.min ?? '—'}–${a.max ?? '—'}</div></div>
  </div>`;

  const bySeasonLabeled = Object.fromEntries(Object.entries(d.by_season).map(([y,n]) => [seasonLabel(y), n]));

  const dist = `<div class="dist-grid">
    ${distBlock(t('d_seasons'), bySeasonLabeled, total, 'var(--blue)', 5)}
    ${distBlock(t('d_positions'), d.by_position, total, 'var(--green)', 5)}
    ${distBlock(t('d_nats'), countryKeys(d.by_nationality), total, 'var(--purple)', 5)}
    ${distBlock(t('d_leagues'), d.by_from_league, total, 'var(--yellow)', 5)}
    ${distBlock(t('d_clubs'), d.by_from_club, total, 'var(--muted)', 5)}
  </div>`;

  const LINE_MEMBERS = {
    ATT: ['LW','RW','CF','ST'],
    DEF: ['CB','LB','RB','LWB','RWB'],
    MID: ['CDM','CM','CAM','LM','RM'],
    GK:  ['GK'],
  };
  const posSet = pos => new Set(LINE_MEMBERS[pos] || [pos]);

  const profileRows = d.profiles.map((p, i) => {
    const detailId = `pd-${i}-${Date.now()}`;
    const members = posSet(p.position_norm);
    const pa = d.arrivals.filter(t => members.has(t.position_norm));
    const byNat    = countBy(pa, t => countryName(t.nationality));
    const byLeague = countBy(pa, t => t.from_league);
    const byClub   = countBy(pa, t => t.from_club);
    const playerRows = pa.map(t => `<tr>
      <td class="muted">${arrivalDate(t)}</td>
      <td>${typeLabel(t.transfer_type)}</td>
      <td style="font-weight:600">${esc(t.player_name)}</td>
      <td>${fmt(t.fee)}</td>
      <td>${t.age ?? '—'}</td>
      <td>${esc(countryName(t.nationality) || '—')}</td>
      <td class="trunc muted" title="${esc(t.from_club)}">${esc(t.from_club || '—')}</td>
      <td class="trunc muted" title="${esc(t.from_league)}">${esc(t.from_league || '—')}</td>
    </tr>`).join('');
    return `<tr>
      <td><span class="badge ${posBadge(p.position_norm, p.is_most_frequent)}">${p.position_norm}</span></td>
      <td>${p.n}</td><td>${p.n_permanent}</td>
      <td>${p.age_mean != null ? p.age_mean.toFixed(1) : '—'}</td>
      <td>${fmt(p.fee_mean)}</td>
      <td>${p.nationality_mode ? esc(countryName(p.nationality_mode)) : '<span class="muted">—</span>'}</td>
      <td class="trunc muted" title="${esc(p.from_league_mode)}">${esc(p.from_league_mode || '—')}</td>
      <td class="trunc muted" title="${esc(p.from_club_mode)}">${esc(p.from_club_mode || '—')}</td>
      <td><span class="see-all" role="button" tabindex="0" onclick="togglePosDetail('${detailId}',this)">${tr('more')}</span></td>
    </tr>
    <tr id="${detailId}" style="display:none"><td colspan="9" style="padding:0">
      <div style="padding:12px 16px;display:flex;flex-direction:column;gap:14px;background:#13141f;border-top:1px solid var(--border)">
        <div class="dist-grid" style="grid-template-columns:repeat(3,1fr)">
          ${distBlock(t('d_nats'), byNat, pa.length, 'var(--purple)', 5)}
          ${distBlock(t('d_leagues'), byLeague, pa.length, 'var(--yellow)', 5)}
          ${distBlock(t('d_clubs'), byClub, pa.length, 'var(--blue)', 5)}
        </div>
        <div class="table-wrap"><table>
          <thead>${thead('th_season', 'th_type', 'th_player', 'th_fee', 'th_age', 'th_nat', 'th_from_club', 'th_from_league')}</thead>
          <tbody>${playerRows}</tbody>
        </table></div>
      </div>
    </td></tr>`;
  }).join('');

  const profilesTable = `<div class="table-wrap"><table>
    <thead>${thead('th_position', 'n', 'th_nperm', 'th_age_mean', 'th_fee_mean', 'th_nat_mode', 'th_league_mode', 'th_club_mode', '')}</thead>
    <tbody>${profileRows}</tbody>
  </table></div>`;

  const arrivalRow = t => arrivalRowHtml(t);

  const PAGE = 20;
  const arrivals = d.arrivals;
  const key = 'arr_' + Date.now();
  window._arrivals = window._arrivals || {};
  window._arrivals[key] = arrivals;
  const initialRows = arrivals.slice(0, PAGE).map(arrivalRow).join('');
  const hasMore = arrivals.length > PAGE;

  const arrivalsTable = `<div class="table-wrap"><table class="sortable">
    <thead>${thead('th_season', 'th_type', 'th_player', 'th_pos', 'th_fee', 'th_age', 'th_nat', 'th_from_club', 'th_from_league', '')}</thead>
    <tbody id="${key}">${initialRows}</tbody>
  </table></div>
  ${hasMore ? `<span class="see-all" role="button" tabindex="0" onclick="loadAllArrivals('${key}', this)">${tr('load_more', { n: arrivals.length - PAGE })}</span>` : ''}`;

  return `
    <div class="card">
      <div class="card-header">📊 ${tr('overview_title', { club: d.club, ed: edLabel(d.fifa_edition) })}</div>
      <div class="card-body" style="display:flex;flex-direction:column;gap:20px">
        ${chips}
        ${dist}
      </div>
    </div>
    <div class="card">
      <div class="card-header">📐 ${tr('profiles')}</div>
      ${profilesTable}
    </div>
    <div class="card">
      <div class="card-header">📋 ${tr('all_arrivals', { n: total })}</div>
      ${arrivalsTable}
    </div>`;
}

// ── scout (candidatos) ────────────────────────────────────────────
async function runScout() {
  const edition = parseInt(document.getElementById('sel-edition').value);
  const history = parseInt(document.getElementById('inp-history').value);
  const top_n   = parseInt(document.getElementById('inp-topn').value);
  const potential_weight = parseFloat(document.getElementById('sel-potential').value);
  const realism = document.getElementById('sel-realism').value === '1';
  const level_offset = parseInt(document.getElementById('sel-level').value);
  const sort_by = realism ? document.getElementById('sel-sort').value : 'score';
  const score_threshold = realism ? parseFloat(document.getElementById('sel-rol').value) : 0;
  const btn     = document.getElementById('btn-scout');

  btn.disabled = true;
  saveUrl(true);
  document.getElementById('results').innerHTML = '';
  setStatus('status-scout', 'loading', `<span class="spinner"></span>${t('loading_scout')}`);

  try {
    const res = await fetch('/scout', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        club_id: selectedClub.id, club_slug: selectedClub.slug,
        club_name: selectedClub.name, fifa_edition: edition, history, top_n, potential_weight,
        realism, level_offset, sort_by, score_threshold,
      }),
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || res.statusText); }
    _lastScout = await res.json();
    setStatus('status-scout', '');
    renderResults(_lastScout);
  } catch(e) {
    setStatus('status-scout', 'error', `${t('error')}: ${esc(e.message)}`);
  } finally {
    btn.disabled = false;
  }
}

let _lastScout = null;
function renderResults(data) {
  const nav = `<nav class="pos-nav">${data.positions.map(({ profile: p }) =>
    `<a class="badge ${posBadge(p.position_norm, p.is_most_frequent)}" href="#pos-${esc(p.position_norm)}">${esc(p.position_norm)} <span style="opacity:.6">${p.n}</span></a>`).join('')}</nav>`;
  document.getElementById('results').innerHTML = nav + data.positions.map(renderPosition).join('');
}
function scoreTip(b) {
  // ex.: "Valor 28/36 · Idade 25/27 · Nacionalidade 0/18"
  return Object.entries(b || {}).map(([k, [got, max]]) => `${t('ax_' + k)} ${got}/${max}`).join(' · ');
}
function renderPosition({ profile: p, candidates, team_overall }) {
  const lvl = team_overall != null
    ? `&nbsp;|&nbsp; ${tr('hdr_level')} <b style="color:var(--green)">${team_overall}</b>` : '';
  const rows = candidates.map((c, i) => {
    const pct = Math.round(c.score * 100);
    const ovrCls = c.overall >= 80 ? 'high' : c.overall >= 70 ? 'mid' : 'low';
    return `<tr>
      <td class="muted">${i+1}</td>
      <td style="font-weight:600;max-width:160px" class="trunc" title="${esc(c.short_name)}">${esc(c.short_name)}</td>
      <td class="trunc muted" title="${esc(c.club_name)}">${esc(c.club_name)}</td>
      <td class="trunc muted" title="${esc(c.league_name)}">${esc(c.league_name)}</td>
      <td>${esc(countryName(c.nationality))}</td><td>${c.age}</td>
      <td>${fmt(c.value_eur)}</td>
      <td class="ovr ${ovrCls}">${c.overall}</td>
      <td class="ovr ${c.potential >= 85 ? 'high' : c.potential >= 78 ? 'mid' : 'low'}">${c.potential || '—'}</td>
      <td title="${esc(scoreTip(c.breakdown))}" style="cursor:help"><div class="score-bar"><div class="bar"><div class="fill" style="width:${pct}%"></div></div><span class="val">${pct}%</span></div></td>
      <td>${c.sofifa_id ? `<a href="https://sofifa.com/player/${encodeURIComponent(c.sofifa_id)}" target="_blank" style="color:var(--blue);font-size:11px">SoFIFA ↗</a>` : ''}</td>
    </tr>`;
  }).join('');

  return `<div class="card" id="pos-${esc(p.position_norm)}">
    <div class="card-header">
      <span class="badge ${posBadge(p.position_norm, p.is_most_frequent)}">${p.position_norm}</span>
      <span style="font-size:12px;color:var(--muted)">
        n=${p.n} &nbsp;|&nbsp; ${tr('hdr_age')} ${p.age_mean?.toFixed(1) ?? '—'} &nbsp;|&nbsp; ${tr('hdr_fee')} ${fmt(p.fee_mean)}
        &nbsp;|&nbsp; ${tr('hdr_nat')} ${esc(countryName(p.nationality_mode) ?? '—')} &nbsp;|&nbsp; ${tr('hdr_league')} ${esc(p.from_league_mode ?? '—')}${lvl}
      </span>
    </div>
    <div class="table-wrap"><table class="sortable">
      <thead>${thead('#', 'th_name', 'th_club', 'th_league', 'th_nat', 'th_age', 'th_value', 'OVR', 'POT', 'Score', '')}</thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

applyI18n();
init();
</script>
