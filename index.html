<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Tokens: gramado sóbrio + tiers de carta (bronze/prata/ouro) + cores de linha do jogo.
     light-dark() escolhe pelo color-scheme: segue o sistema, ou o toggle via data-theme. */
  :root {
    color-scheme: light dark;
    --ground: light-dark(#F3F6F4, #0F1613);
    --surface: light-dark(#FFFFFF, #16201B);
    --raised: light-dark(#F8FAF9, #1B2721);
    --ink: light-dark(#16211C, #E3EAE6);
    --muted: light-dark(#56645D, #9AA9A1);
    --faint: light-dark(#8A9790, #6E7D75);
    --line: light-dark(#DCE3DF, #25322B);
    --line-strong: light-dark(#BCC8C1, #3A4A42);
    --pitch: light-dark(#1E6B47, #4BAA78);
    --pitch-ink: light-dark(#FFFFFF, #07130D);
    --pitch-soft: light-dark(#E2EFE8, #1B3327);
    --focus: light-dark(#2F6FDB, #7FA9F6);
    --danger: light-dark(#A8261E, #F28B82);
    --danger-soft: light-dark(#FBEAE8, #3A1E1C);
    --gk: light-dark(#8F5E0E, #E2AD52);
    --def: light-dark(#2160A6, #79A9E4);
    --mid: light-dark(#2A7449, #64C18E);
    --att: light-dark(#B03636, #EC8A84);
    --bronze: light-dark(#8A4F28, #DDA27A);
    --bronze-bg: light-dark(#F4E4D7, #3A2A1F);
    --silver: light-dark(#59656E, #C1CBD2);
    --silver-bg: light-dark(#E6EBEE, #2B3238);
    --gold: light-dark(#876A0E, #E8C964);
    --gold-bg: light-dark(#F7EBBF, #3A3219);
    --font: 'Barlow', system-ui, sans-serif;
    --font-cond: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
    --radius: 8px;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"]  { color-scheme: dark; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ground); color: var(--ink); font: 400 15px/1.5 var(--font); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  html { scroll-behavior: smooth; }
  a { color: var(--pitch); }
  code { font-size: .9em; background: var(--raised); padding: 1px 5px; border-radius: 4px; }

  /* Topo */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 22px/1 var(--font-cond); letter-spacing: .01em; color: var(--ink); text-decoration: none; }
  .brand svg { color: var(--pitch); }
  .topbar select { width: auto; }
  .icon-btn { margin-left: auto; display: inline-grid; place-items: center; width: 40px; height: 40px; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 6px; }
  .icon-btn:hover { border-color: var(--pitch); color: var(--pitch); }
  /* mostra o ícone do modo para o qual o clique leva */
  .i-sun { display: none; }
  :root[data-theme="dark"] .i-sun { display: block; }
  :root[data-theme="dark"] .i-moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .i-sun { display: block; }
    :root:not([data-theme="light"]) .i-moon { display: none; }
  }

  .page { max-width: 1280px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }

  /* Seletor em 4 passos (é uma sequência real: cada passo libera o próximo) */
  .picker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .step { display: grid; gap: 6px; }
  .step label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .step-num { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font: 600 12px/1 var(--font); background: var(--raised); color: var(--faint); border: 1px solid var(--line); }
  .step.active .step-num { background: var(--pitch); color: var(--pitch-ink); border-color: var(--pitch); }
  .step.active label { color: var(--ink); }

  select, input[type=number] { width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 10px; font: 500 16px/1.3 var(--font); }  /* 16px: abaixo disso o Safari do iPhone dá zoom no foco */
  select:disabled, input:disabled { opacity: .5; cursor: not-allowed; }

  /* Layout: ajustes à esquerda, resultados à direita */
  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
  .settings { display: grid; gap: 16px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); position: sticky; top: 16px; }
  .settings h2 { font: 600 18px/1.2 var(--font-cond); }
  .settings label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .settings label > span { display: flex; align-items: center; gap: 6px; }
  .info::after { content: ''; position: absolute; inset: -14px; }  /* área de toque ~44px */
  .info { position: relative; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font: 600 11px/1 var(--font); color: var(--muted); border: 1px solid var(--line-strong); cursor: help; }
  .info:hover { color: var(--ink); border-color: var(--muted); }
  .realism-group { display: grid; gap: 16px; padding-left: 12px; border-left: 2px solid var(--pitch-soft); }
  .hint { font-size: 13px; color: var(--muted); }

  button { font: 600 15px/1 var(--font); cursor: pointer; border-radius: 6px; }
  #btn-scout { background: var(--pitch); color: var(--pitch-ink); border: 0; padding: 12px 16px; }
  #btn-scout:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-secondary { background: transparent; color: var(--pitch); border: 1px solid var(--line-strong); padding: 9px 14px; font-size: 14px; }
  .btn-secondary:hover { border-color: var(--pitch); background: var(--pitch-soft); }

  .content { display: grid; gap: 24px; min-width: 0; }

  /* Estados */
  .status-bar { display: none; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
  .status-bar.loading { color: var(--muted); }
  .status-bar.error { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--pitch); border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 10px; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { padding: 48px 32px; text-align: center; border: 1px dashed var(--line-strong); border-radius: var(--radius); color: var(--muted); }
  .empty h2 { font: 600 24px/1.2 var(--font-cond); color: var(--ink); margin-bottom: 6px; }
  .empty p { max-width: 46ch; margin: 0 auto; }
  #status-overview[style*="block"] ~ .empty, #overview:not(:empty) ~ .empty { display: none; }

  /* Dossiê do clube — o elemento de destaque da página */
  .dossier { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 32px; padding: 24px 28px; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--pitch); border-radius: var(--radius); }
  .club-name { grid-column: 1 / -1; font: 700 clamp(32px, 4.5vw, 48px)/1 var(--font-cond); letter-spacing: -.005em; }
  .dossier-sub { grid-column: 1 / -1; color: var(--muted); font-weight: 500; }
  .dossier-summary { font-size: 17px; max-width: 60ch; margin-top: 10px; padding-left: 1.2em; display: grid; gap: 2px; }
  .dossier-summary li::marker { color: var(--pitch); }
  .dossier .btn-secondary { align-self: end; justify-self: end; }
  .typical { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 32px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .typical dt { font-size: 13px; color: var(--muted); }
  .typical dd { font: 600 20px/1.2 var(--font-cond); }

  /* Seções genéricas (modal de histórico) */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .card-header { padding: 12px 16px; border-bottom: 1px solid var(--line); font: 600 18px/1.2 var(--font-cond); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card-body { padding: 16px; }
  .section-title { font: 600 26px/1.1 var(--font-cond); }

  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 24px; }
  .chip .label { font-size: 13px; color: var(--muted); }
  .chip .value { font: 600 22px/1.2 var(--font-cond); font-variant-numeric: tabular-nums; }

  .dist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .dist-block h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .dist-row { display: grid; grid-template-columns: 120px 1fr 28px; align-items: center; gap: 10px; margin-bottom: 5px; font-size: 14px; }
  .dist-row .key { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dist-row .bar, .score-bar .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .dist-row .fill, .score-bar .fill { height: 100%; border-radius: 3px; }
  .dist-row .n { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

  /* Tabelas */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 13px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; background: var(--raised); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--raised); }
  th.num, td.num { text-align: right; }
  .player { font-weight: 600; }
  .player a { color: inherit; text-decoration: none; }
  .player a:hover { color: var(--pitch); text-decoration: underline; }
  .show-sm { display: none !important; }
  .muted { color: var(--muted); }
  .trunc { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  td .sub { display: block; font-size: 13px; font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .ext { font-size: 13px; font-weight: 500; text-decoration: none; }
  .ext:hover { text-decoration: underline; }
  table.sortable th { cursor: pointer; user-select: none; }
  table.sortable th:hover { color: var(--ink); }
  table.sortable th[data-dir=desc]::after { content: ' ▼'; font-size: 10px; }
  table.sortable th[data-dir=asc]::after  { content: ' ▲'; font-size: 10px; }

  /* Badges de posição: cor da linha (padrão do jogo) */
  .badge { display: inline-block; min-width: 38px; text-align: center; padding: 2px 8px; border-radius: 4px; font: 700 14px/1.3 var(--font-cond); letter-spacing: .02em; color: var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 13%, transparent); border: 1px solid color-mix(in srgb, var(--c, var(--muted)) 35%, transparent); text-decoration: none; }
  .badge-pos-gk  { --c: var(--gk); }
  .badge-pos-def { --c: var(--def); }
  .badge-pos-mid { --c: var(--mid); }
  .badge-pos-att { --c: var(--att); }
  .badge-freq::after { content: ' ★'; }
  .badge-perm, .badge-loan, .badge-free { min-width: 0; font: 500 12px/1.4 var(--font); letter-spacing: 0; }
  .badge-perm { --c: var(--pitch); }
  .badge-loan { --c: var(--def); }
  .badge-free { --c: var(--gold); }

  /* Tiers de carta (FUT): bronze < 65, prata 65–74, ouro ≥ 75 */
  .tier { display: inline-block; min-width: 34px; text-align: center; padding: 1px 6px; border-radius: 4px; font: 700 16px/1.3 var(--font-cond); }
  .tier.bronze { color: var(--bronze); background: var(--bronze-bg); }
  .tier.silver { color: var(--silver); background: var(--silver-bg); }
  .tier.gold   { color: var(--gold);   background: var(--gold-bg); }

  .score-bar { display: grid; grid-template-columns: 56px 36px; align-items: center; gap: 8px; justify-content: end; }
  .score-bar .fill { background: var(--pitch); }
  .score-bar .val { font-size: 14px; text-align: right; }

  /* Resultados por posição */
  .pos-nav { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; background: var(--ground); }
  .pos-section { scroll-margin-top: 56px; }
  .pos-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .pos-head .badge { font-size: 17px; }
  .pos-profile { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14px; }
  .pos-profile div { display: flex; gap: 6px; }
  .pos-profile dt { color: var(--muted); }
  .pos-profile dd { font-weight: 600; }
  #results { display: grid; gap: 20px; }
  #overview:empty, #results:empty { display: none; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgb(8 14 11 / .55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal-overlay.hidden { display: none; }
  .modal-box { background: var(--ground); border: 1px solid var(--line); border-radius: 10px; width: min(480px, 100%); max-height: 85vh; max-height: 85dvh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgb(0 0 0 / .25); }
  .modal-box.wide { width: min(1100px, 100%); max-height: 90vh; max-height: 90dvh; }
  .modal-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; font: 600 20px/1.2 var(--font-cond); background: var(--surface); border-radius: 10px 10px 0 0; }
  .modal-close { background: none; border: 0; color: var(--muted); font-size: 24px; line-height: 1; padding: 2px 8px; }
  .modal-close:hover { color: var(--ink); }
  .modal-body { overflow-y: auto; padding: 18px; display: grid; grid-auto-rows: max-content; gap: 20px; }

  .tip { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 200; max-width: 520px; margin: 0 auto; padding: 12px 16px; background: var(--ink); color: var(--surface); border-radius: var(--radius); white-space: pre-line; font-size: 15px; box-shadow: 0 10px 30px rgb(0 0 0 / .3); }
  .tip[hidden] { display: none; }

  .see-all { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 500; color: var(--pitch); cursor: pointer; }
  .see-all:hover { text-decoration: underline; }

  @media (max-width: 900px) {
    .picker { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .layout { grid-template-columns: 1fr; }
    .settings { position: static; }
  }
  @media (max-width: 520px) {
    .page { padding: 16px; }
    .topbar { padding: 12px 16px; }
    .picker { grid-template-columns: 1fr; }
    .dossier { grid-template-columns: 1fr; padding: 20px; }
    .dossier .btn-secondary { justify-self: start; }
    /* tabela de candidatos compacta: nome+clube, idade, valor, OVR, POT, % */
    .hide-sm { display: none; }
    .show-sm { display: block !important; }
    .pos-section th, .pos-section td { padding: 9px 6px; }
    .pos-section td.player { max-width: 140px; white-space: normal; }
    .score-bar { grid-template-columns: 36px; }
    .score-bar .bar { display: none; }
    .modal-overlay { padding: 8px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="23" height="23" rx="3" stroke="currentColor" stroke-width="2"/><line x1="13" y1="2" x2="13" y2="24" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="13" r="4.5" stroke="currentColor" stroke-width="2"/></svg>
    Career Scout
  </a>
  <button id="btn-theme" class="icon-btn" type="button" onclick="toggleTheme()">
    <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <select id="sel-lang" onchange="setLang(this.value)" aria-label="Idioma / Language / Idioma">
    <option value="pt">Português</option>
    <option value="en">English</option>
    <option value="es">Español</option>
  </select>
</header>

<div class="page">
  <!-- Escolha do clube: 4 passos em sequência -->
  <section class="picker" aria-label="Clube">
    <div class="step active" id="step-edition">
      <label for="sel-edition"><span class="step-num">1</span><span data-i18n="step_edition"></span></label>
      <select id="sel-edition" onchange="onEditionChange()"><option value="" data-i18n="loading"></option></select>
    </div>
    <div class="step" id="step-country">
      <label for="sel-country"><span class="step-num">2</span><span data-i18n="step_country"></span></label>
      <select id="sel-country" disabled onchange="onCountryChange()"><option value="" data-i18n="pick_edition"></option></select>
    </div>
    <div class="step" id="step-league">
      <label for="sel-league"><span class="step-num">3</span><span data-i18n="step_league"></span></label>
      <select id="sel-league" disabled onchange="onLeagueChange()"><option value="" data-i18n="pick_country"></option></select>
    </div>
    <div class="step" id="step-club">
      <label for="sel-club"><span class="step-num">4</span><span data-i18n="step_club"></span></label>
      <select id="sel-club" disabled onchange="onClubChange()"><option value="" data-i18n="pick_league"></option></select>
    </div>
  </section>

  <div class="layout">
    <!-- Ajustes da busca -->
    <aside class="settings">
      <h2 data-i18n="settings"></h2>
      <label><span><span data-i18n="hist"></span><span class="info" tabindex="0" role="img" data-i18n-title="hist_tip" data-i18n-aria="hist_tip">i</span></span><input type="number" id="inp-history" value="5" min="2" max="15" disabled onchange="loadOverview()"></label>
      <label><span><span data-i18n="topn"></span><span class="info" tabindex="0" role="img" data-i18n-title="topn_tip" data-i18n-aria="topn_tip">i</span></span><input type="number" id="inp-topn" value="10" min="5" max="50" disabled></label>
      <label><span><span data-i18n="pot"></span><span class="info" tabindex="0" role="img" data-i18n-title="pot_tip" data-i18n-aria="pot_tip">i</span></span><select id="sel-potential" disabled>
        <option value="0" data-i18n="off"></option>
        <option value="0.15" data-i18n="low"></option>
        <option value="0.3" data-i18n="mid"></option>
        <option value="0.5" data-i18n="high"></option>
      </select></label>
      <label><span><span data-i18n="realism"></span><span class="info" tabindex="0" role="img" data-i18n-title="realism_tip" data-i18n-aria="realism_tip">i</span></span><select id="sel-realism" disabled onchange="onRealismChange()">
        <option value="0" data-i18n="off"></option>
        <option value="1" data-i18n="on"></option>
      </select></label>
      <div class="realism-group realism-only" style="display:none">
        <label><span><span data-i18n="level"></span><span class="info" tabindex="0" role="img" data-i18n-title="level_tip" data-i18n-aria="level_tip">i</span></span><select id="sel-level">
          <option value="0" data-i18n="lvl_same"></option>
          <option value="3" data-i18n="lvl_up"></option>
          <option value="-3" data-i18n="lvl_cheap"></option>
        </select></label>
        <label><span><span data-i18n="sort"></span><span class="info" tabindex="0" role="img" data-i18n-title="sort_tip" data-i18n-aria="sort_tip">i</span></span><select id="sel-sort">
          <option value="score" data-i18n="sort_score"></option>
          <option value="overall" data-i18n="sort_ovr"></option>
        </select></label>
        <label><span><span data-i18n="rol"></span><span class="info" tabindex="0" role="img" data-i18n-title="rol_tip" data-i18n-aria="rol_tip">i</span></span><select id="sel-rol">
          <option value="0.6" data-i18n="rol_strict"></option>
          <option value="0.45" selected data-i18n="rol_mid"></option>
          <option value="0.3" data-i18n="rol_wide"></option>
        </select></label>
      </div>
      <button id="btn-scout" disabled onclick="runScout()" data-i18n="btn_scout"></button>
      <p class="hint" id="hint"></p>
    </aside>

    <main class="content">
      <div id="status-overview" class="status-bar" role="status"></div>
      <div id="overview"></div>
      <div class="empty">
        <h2 data-i18n="empty_title"></h2>

const LOCALE = { pt: 'pt-BR', en: 'en', es: 'es' };
let LANG = (() => { try { return localStorage.getItem('lang'); } catch { return null; } })();
if (!I18N[LANG]) LANG = { en: 'en', es: 'es' }[navigator.language.slice(0, 2)] || 'pt';

function t(key, vars = {}) {
  const s = I18N[LANG][key] ?? I18N.pt[key] ?? key;  // chave desconhecida ("OVR", "#") passa direto
  return s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
}
// t() para templates HTML: escapa o texto e as variáveis (nome do clube vem dos dados)
function tr(key, vars = {}) {
  return esc(t(key, vars));
}
// prefixos na chave: '>' coluna numérica (à direita), '~' some no celular — ex.: '~>#'
function thead(...keys) {
  return `<tr>${keys.map(k => {
    const [, flags, key] = k.match(/^([>~]*)(.*)$/);
    const cls = [flags.includes('>') && 'num', flags.includes('~') && 'hide-sm'].filter(Boolean).join(' ');
    return `<th${cls ? ` class="${cls}"` : ''}>${key ? esc(t(key)) : ''}</th>`;
  }).join('')}</tr>`;
}
// tiers de carta do FUT: bronze < 65, prata 65–74, ouro ≥ 75
function tier(v) {
  if (!v) return '<span class="muted">—</span>';
  return `<span class="tier ${v >= 75 ? 'gold' : v >= 65 ? 'silver' : 'bronze'}">${v}</span>`;
}

// Países: nomes vêm em inglês (SoFIFA/TM). Tradução nativa via Intl.DisplayNames,
// que precisa do código ISO — o mapa nome→código é montado do próprio Intl em inglês.
const COUNTRY_ISO_ALIAS = {
  'Bonaire': 'BQ', 'Brunei Darussalam': 'BN', 'Cabo Verde': 'CV', 'Cape Verde Islands': 'CV', 'China PR': 'CN',
  'Chinese Taipei': 'TW', 'Congo': 'CG', 'Congo DR': 'CD', 'DR Congo': 'CD', 'Czech Republic': 'CZ', 'Guinea Bissau': 'GW',
  'Hong Kong': 'HK', 'Korea DPR': 'KP', 'Korea Republic': 'KR', 'Korea, South': 'KR', 'Korea, North': 'KP',
  'Kyrgyz Republic': 'KG', 'Macau': 'MO', 'Palestine': 'PS', 'Republic of Ireland': 'IE', 'Saint Kitts and Nevis': 'KN',
  'Saint Lucia': 'LC', 'Saint Vincent and the Grenadines': 'VC', 'Sint Maarten (Dutch part)': 'SX', 'Swaziland': 'SZ',
  'São Tomé e Príncipe': 'ST', 'Turkey': 'TR', 'Türkiye': 'TR', 'UAE': 'AE', 'USA': 'US', 'Bosnia-Herzegovina': 'BA',
};
// sem código ISO de país (nações do Reino Unido) + o "Outros" do backend
const COUNTRY_NON_ISO = {
  'England':          { pt: 'Inglaterra',       en: 'England',          es: 'Inglaterra' },
  'Scotland':         { pt: 'Escócia',          en: 'Scotland',         es: 'Escocia' },
  'Wales':            { pt: 'País de Gales',    en: 'Wales',            es: 'Gales' },
  'Northern Ireland': { pt: 'Irlanda do Norte', en: 'Northern Ireland', es: 'Irlanda del Norte' },
  'Outros':           { pt: 'Outros',           en: 'Others',           es: 'Otros' },
};
const _normCountry = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’`]/g, "'").replace(/&/g, 'and').toLowerCase();
let _isoByName = null;
const _regionNames = {};
function countryName(name) {
  if (!name) return name;
  if (COUNTRY_NON_ISO[name]) return COUNTRY_NON_ISO[name][LANG];
  if (!_isoByName) {
    _isoByName = {};
    const en = new Intl.DisplayNames(['en'], { type: 'region' }), A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    for (const a of A) for (const b of A) {
      const n = en.of(a + b);
      if (n && n !== a + b) _isoByName[_normCountry(n)] = a + b;
    }
  }
  const code = COUNTRY_ISO_ALIAS[name] || _isoByName[_normCountry(name)];
  if (!code) return name;  // desconhecido: mostra como veio
  _regionNames[LANG] ??= new Intl.DisplayNames([LOCALE[LANG]], { type: 'region' });
  return _regionNames[LANG].of(code) || name;
}
// ligas raspadas do SoFIFA vêm como "Championship (England)": traduz só o país
const leagueName = l => l && l.replace(/\(([^()]+)\)$/, (_, c) => `(${countryName(c)})`);

function applyI18n() {
  document.documentElement.lang = LOCALE[LANG];
  document.getElementById('sel-lang').value = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('#sel-country option').forEach(o => { if (o.value) o.textContent = countryName(o.value); });
  document.querySelectorAll('#sel-league option').forEach(o => { if (o.value) o.textContent = leagueName(o.value); });
  labelThemeButton();
}
// ── tema claro/escuro: sem escolha salva, segue o sistema ──
function isDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function labelThemeButton() {
  const btn = document.getElementById('btn-theme'), label = t(isDark() ? 'theme_light' : 'theme_dark');
  btn.setAttribute('aria-label', label); btn.title = label;
}
function toggleTheme() {
  const theme = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('theme', theme); } catch {}
  labelThemeButton();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', labelThemeButton);

function setLang(lang) {
  LANG = lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyI18n();
  // re-renderiza o que já está na tela com o novo idioma
  const ov = window._overviewData;
  if (ov && document.getElementById('overview').innerHTML) document.getElementById('overview').innerHTML = renderSimplePanel(ov, ov._history);
  if (_lastScout && document.getElementById('results').innerHTML) renderResults(_lastScout);
  if (!document.getElementById('modal').classList.contains('hidden')) hideModal();
}


// ── init ─────────────────────────────────────────────────────────
async function init() {
  const years = await fetch('/fifa-years').then(r => r.json());
  const sel = document.getElementById('sel-edition');
  if (!years.length) {
    reset('sel-edition', 'no_data', false);
    setStatus('status-overview', 'error', t('no_data_msg', { link:
      '<a href="https://github.com/guigasauro/career-scout#dados-do-sofifa-não-inclusos" target="_blank">README → SoFIFA</a>' }));
    return;
  }
  reset('sel-edition', 'select', false);
  [...years].reverse().forEach(y => {
    const o = new Option(edLabel(y), y);
    sel.appendChild(o);
  });
  await restoreFromUrl();
}

// ── estado na URL (?ed=22&club=583…) — recarregar/compartilhar mantém a busca ──
const URL_FIELDS = {
  ed: 'sel-edition', country: 'sel-country', league: 'sel-league',
  hist: 'inp-history', top: 'inp-topn', pot: 'sel-potential',
  real: 'sel-realism', lvl: 'sel-level', sort: 'sel-sort', rol: 'sel-rol',
};
function saveUrl(run = false) {
  const q = new URLSearchParams();
  for (const [k, id] of Object.entries(URL_FIELDS)) {
    const v = document.getElementById(id).value;
    if (v) q.set(k, v);
  }
  if (selectedClub) q.set('club', selectedClub.id);
  if (run) q.set('run', '1');
  const qs = q.toString();
  window.history.replaceState(null, '', qs ? '?' + qs : location.pathname);
}
async function restoreFromUrl() {
  const q = new URLSearchParams(location.search);
  const set = k => { if (q.has(k)) document.getElementById(URL_FIELDS[k]).value = q.get(k); };
  ['hist', 'top', 'pot', 'real', 'lvl', 'sort', 'rol'].forEach(set);
  onRealismChange();
  if (!q.has('ed')) return;
  set('ed');      await onEditionChange();
  if (!q.has('country')) return;
  set('country'); await onCountryChange();
  if (!q.has('league')) return;
  set('league');  await onLeagueChange();
  const sel = document.getElementById('sel-club');
  const opt = [...sel.options].find(o => o.value && String(JSON.parse(o.value).id) === q.get('club'));
  if (!opt) return;
  sel.value = opt.value;
  await onClubChange();
  if (q.get('run')) runScout();
}
// qualquer mudança no formulário regrava a URL (e derruba o run=1)
document.querySelectorAll('.picker, .settings').forEach(el => el.addEventListener('change', () => saveUrl()));

// ── cascata de selects ────────────────────────────────────────────
async function onEditionChange() {
  const edition = document.getElementById('sel-edition').value;
  reset('sel-country', 'pick_edition', true);
  reset('sel-league',  'pick_country', true);
  reset('sel-club',    'pick_league',  true);
  setStep('step-country', false); setStep('step-league', false); setStep('step-club', false);
  lockFooter(); clearOverview(); selectedClub = null;
  if (!edition) return;

  const ctrs = await fetch(`/countries?edition=${edition}`).then(r => r.json());
  const sel = document.getElementById('sel-country');
  reset('sel-country', 'select', false);
  // valor fica em inglês (é o que a API espera); só o rótulo é traduzido
  ctrs.map(c => [countryName(c), c]).sort(([a], [b]) => a.localeCompare(b, LOCALE[LANG]))
      .forEach(([label, c]) => sel.appendChild(new Option(label, c)));
  sel.disabled = false; setStep('step-country', true);
}

async function onCountryChange() {
  const edition = document.getElementById('sel-edition').value;
  const country = document.getElementById('sel-country').value;
  reset('sel-league', 'pick_country', true);
  reset('sel-club',   'pick_league',  true);
  setStep('step-league', false); setStep('step-club', false);
  lockFooter(); clearOverview(); selectedClub = null;
  if (!country) return;

  const leagues = await fetch(`/leagues?edition=${edition}&country=${encodeURIComponent(country)}`).then(r => r.json());
  const sel = document.getElementById('sel-league');
  reset('sel-league', 'select', false);
  leagues.forEach(l => sel.appendChild(new Option(leagueName(l), l)));
  sel.disabled = false; setStep('step-league', true);
}

async function onLeagueChange() {
  const league = document.getElementById('sel-league').value;
  reset('sel-club', 'pick_league', true);
  setStep('step-club', false); lockFooter(); clearOverview(); selectedClub = null;
  if (!league) return;

  const clubs = await fetch(`/clubs?league=${encodeURIComponent(league)}`).then(r => r.json());
  const sel = document.getElementById('sel-club');
  if (!clubs.length) {
    reset('sel-club', 'no_clubs', true);
    setHint('hint_unmapped');
    return;
  }
  reset('sel-club', 'select', false);
  clubs.forEach(c => sel.appendChild(new Option(c.name, JSON.stringify(c))));
  sel.disabled = false; setStep('step-club', true);
  setHint(null);
}

async function onClubChange() {
  const val = document.getElementById('sel-club').value;
  selectedClub = val ? JSON.parse(val) : null;
  lockFooter(); clearOverview();
  if (!selectedClub) return;
  document.getElementById('inp-history').disabled  = false;
  document.getElementById('inp-topn').disabled     = false;
  document.getElementById('sel-potential').disabled = false;
  document.getElementById('sel-realism').disabled  = false;

function setStep(id, active) { document.getElementById(id).classList.toggle('active', active); }
function onRealismChange() {

function lockFooter() {

// mensagem de erro da API; 429 vem do limite do nginx (HTML, não JSON)
async function apiError(res) {
  if (res.status === 429) return t('rate_limited');
  try { return (await res.json()).detail || res.statusText; } catch { return res.statusText; }
}
function setStatus(id, type, html = '') {
  const el = document.getElementById(id);
  el.className = 'status-bar' + (type ? ` ${type}` : '');
  el.style.display = type ? 'block' : 'none';
  el.innerHTML = html;
}
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(v, dec = 1) {
  if (v == null) return '—';
  if (v >= 1e6) return `€${(v/1e6).toFixed(dec)}M`;
  if (v >= 1e3) return `€${(v/1e3).toFixed(0)}K`;
  return `€${v}`;
}
function edLabel(y) { return y >= 24 ? `EA FC ${y}` : `FIFA ${y}`; }
function fmtAge(v) { return v != null ? `${v}` : '—'; }
function pct(v, total) { return total ? Math.round(v / total * 100) : 0; }
function arrivalRowHtml(t) {
  return `<tr>
    <td class="muted">${arrivalDate(t)}</td>
    <td>${typeLabel(t.transfer_type)}</td>
    <td class="player">${esc(t.player_name)}</td>
    <td><span class="badge ${posBadge(t.position_norm, false)}">${esc(t.position_norm || '?')}</span></td>
    <td class="num">${fmt(t.fee)}</td>
    <td class="num">${t.age ?? '—'}</td>
    <td>${esc(countryName(t.nationality) || '—')}</td>
    <td class="trunc muted" title="${esc(t.from_club)}">${esc(t.from_club || '—')}</td>
    <td class="trunc muted" title="${esc(t.from_league)}">${esc(t.from_league || '—')}</td>
    <td><a class="ext" href="${esc(t.player_url)}" target="_blank" rel="noopener">TM ↗</a></td>
  </tr>`;
}
function loadAllArrivals(key, btn) {
  const tbody = document.getElementById(key);
  if (!tbody) return;
  tbody.innerHTML = (window._arrivals[key] || []).map(arrivalRowHtml).join('');
  btn.remove();
}
function posBadge(pos, isFreq) {
  // cor da linha sempre; ★ marca a posição mais contratada
  const p = pos || '';
  const line = p === 'GK' ? 'gk'
    : ['CB','LB','RB','LWB','RWB','DEF'].includes(p) ? 'def'
    : ['CDM','CM','CAM','LM','RM','MID'].includes(p) ? 'mid'
    : ['LW','RW','CF','ST','ATT'].includes(p) ? 'att' : '';
  return (line ? `badge-pos-${line}` : '') + (isFreq ? ' badge-freq' : '');
}
function typeLabel(t) {
  if (t === 'permanent') return `<span class="badge badge-perm">${tr('type_perm')}</span>`;
  if (t === 'loan')      return `<span class="badge badge-loan">${tr('type_loan')}</span>`;
  return `<span class="badge badge-free">${tr('type_free')}</span>`;
}
function seasonLabel(y) { return `${y}/${String(Number(y)+1).slice(2)}`; }  // 2012 → "2012/13"
function arrivalDate(t) {
  // TM agrega Summer+Winter por temporada; só a temporada é conhecida.
  return seasonLabel(t.season);
}
function countBy(arr, fn) {
  const c = {};
  arr.forEach(x => { const k = fn(x); if (k) c[k] = (c[k] || 0) + 1; });
  return c;
}
function togglePosDetail(id, btn) {
  const row = document.getElementById(id);
  if (!row) return;
  const open = row.style.display !== 'none';
  row.style.display = open ? 'none' : '';
  btn.textContent = open ? t('more') : t('less');
}

// ── ordenação por cabeçalho (table.sortable) ─────────────────────
function cellKey(td) {
  // "€10.5M" → 10500000, "€500K" → 500000, "85%" → 85, "2019/20" → 2019; resto vira texto
  const m = td.textContent.trim().match(/^€?(-?\d+(?:\.\d+)?)\s*([MK]?)/);
  return m ? parseFloat(m[1]) * ({ M: 1e6, K: 1e3 }[m[2]] || 1) : td.textContent.trim().toLowerCase();
}
document.addEventListener('click', e => {
  const th = e.target.closest('table.sortable th');
  if (!th || !th.textContent.trim()) return;
  const tbody = th.closest('table').tBodies[0], i = th.cellIndex;
  const dir = th.dataset.dir === 'desc' ? 'asc' : 'desc';  // 1º clique: maior primeiro
  th.parentElement.querySelectorAll('th').forEach(h => delete h.dataset.dir);
  th.dataset.dir = dir;
  const sign = dir === 'asc' ? 1 : -1;
  const rows = [...tbody.rows].map(r => [cellKey(r.cells[i]), r]);
  rows.sort(([a], [b]) => {
    const na = typeof a === 'number', nb = typeof b === 'number';
    if (na !== nb) return na ? -1 : 1;  // "—" sempre no fim
    return sign * (na ? a - b : a.localeCompare(b));
  });
  rows.forEach(([, r]) => tbody.appendChild(r));
});

// Telas de toque não têm hover, então o `title` (ⓘ, detalhe do score, ★) nunca aparece:
// o toque mostra o texto num balão fixo no rodapé.
document.addEventListener('click', e => {
  if (!matchMedia('(hover: none)').matches) return;
  const tip = document.getElementById('tip');
  const el = e.target.closest('[title]');
  if (!el || el.closest('a, button, select, th')) {
    // o toque num <label> gera um segundo clique no campo; esse não fecha o balão
    if (!e.target.closest('label')) tip.hidden = true;
    return;
  }
  if (el.matches('.info')) e.preventDefault();  // não abre o select/input do label ao tocar no ⓘ
  tip.textContent = el.title;
  tip.hidden = false;
  clearTimeout(tip._timer);
  tip._timer = setTimeout(() => tip.hidden = true, 6000);
});

// Enter/Espaço ativam elementos role=button (os "ver todos"/"ver mais")
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[role=button]')) { e.preventDefault(); e.target.click(); }
});

function distRows(obj, barColor = 'var(--pitch)') {
  const max = Math.max(...Object.values(obj));
  return Object.entries(obj).map(([k, v]) => {
    const w = Math.round(v / max * 100);
    return `<div class="dist-row">
      <span class="key" title="${esc(k)}">${esc(k)}</span>
      <div class="bar"><div class="fill" style="width:${w}%;background:${barColor}"></div></div>
      <span class="n">${v}</span>
    </div>`;
  }).join('');
}

const _dists = [];
function distBlock(title, obj, total, barColor, limit = 5) {
  const entries = Object.entries(obj);
  const top     = Object.fromEntries(entries.slice(0, limit));
  const hasMore = entries.length > limit;
  // dados ficam num registro; inline JSON no onclick quebrava com apóstrofo ("Côte d'Ivoire")
  const idx = _dists.push([title, obj, barColor]) - 1;
  const seeAll  = hasMore
    ? `<span class="see-all" role="button" tabindex="0" onclick="openModal(..._dists[${idx}])">${t('see_all', { n: entries.length })}</span>`
    : '';
  return `<div class="dist-block"><h4>${esc(title)}</h4>${distRows(top, barColor)}${seeAll}</div>`;
}

// traduz as chaves (nomes de país) de um {país: n}
function countryKeys(obj) {
  const out = {};
  for (const [k, v] of Object.entries(obj || {})) { const n = countryName(k); out[n] = (out[n] || 0) + v; }
  return out;
}
function modeKey(obj) { const k = Object.keys(obj || {}); return k.length ? k[0] : null; }

function renderSimplePanel(d, history) {

// ── scout (candidatos) ────────────────────────────────────────────
async function runScout() {
  const edition = parseInt(document.getElementById('sel-edition').value);
  const history = parseInt(document.getElementById('inp-history').value);
  const top_n   = parseInt(document.getElementById('inp-topn').value);
  const potential_weight = parseFloat(document.getElementById('sel-potential').value);
  const realism = document.getElementById('sel-realism').value === '1';
  const level_offset = parseInt(document.getElementById('sel-level').value);
  const sort_by = realism ? document.getElementById('sel-sort').value : 'score';
  const score_threshold = realism ? parseFloat(document.getElementById('sel-rol').value) : 0;
  const btn     = document.getElementById('btn-scout');

  btn.disabled = true;
  saveUrl(true);
  document.getElementById('results').innerHTML = '';
  setStatus('status-scout', 'loading', `<span class="spinner"></span>${t('loading_scout')}`);

  try {
    const res = await fetch('/scout', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        club_id: selectedClub.id, club_slug: selectedClub.slug,
        club_name: selectedClub.name, fifa_edition: edition, history, top_n, potential_weight,
        realism, level_offset, sort_by, score_threshold,
      }),
    });
    if (!res.ok) throw new Error(await apiError(res));
    _lastScout = await res.json();
    setStatus('status-scout', '');
    renderResults(_lastScout);
    // no celular os resultados ficam bem abaixo do botão: rola até eles
    const results = document.getElementById('results');
    if (results.getBoundingClientRect().top > innerHeight * 0.6)
      results.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  } catch(e) {
    setStatus('status-scout', 'error', `${t('error')}: ${esc(e.message)}`);
  } finally {
    btn.disabled = false;
  }
}

function scoreTip(b) {
  // uma linha por eixo, ex.: "Valor: 28 / 36"
  return Object.entries(b || {}).map(([k, [got, max]]) => `${t('ax_' + k)}: ${got} / ${max}`).join('\n');
}
function renderPosition({ profile: p, candidates, team_overall }) {
  const rows = candidates.map((c, i) => {
    const pct = Math.round(c.score * 100);
    const sofifa = c.sofifa_id ? `https://sofifa.com/player/${encodeURIComponent(c.sofifa_id)}` : '';
    return `<tr>
      <td class="num muted hide-sm">${i + 1}</td>
      <td class="player trunc">${sofifa ? `<a href="${sofifa}" target="_blank" rel="noopener">${esc(c.short_name)}</a>` : esc(c.short_name)}<span class="sub show-sm">${esc(c.club_name)}</span></td>
      <td class="trunc hide-sm" title="${esc(c.club_name)} (${esc(leagueName(c.league_name))})">${esc(c.club_name)}<span class="sub">${esc(leagueName(c.league_name))}</span></td>
      <td class="hide-sm">${esc(countryName(c.nationality))}</td>
      <td class="num">${c.age}</td>
      <td class="num">${fmt(c.value_eur)}</td>
      <td class="num">${tier(c.overall)}</td>
      <td class="num">${tier(c.potential)}</td>
      <td class="num" title="${esc(scoreTip(c.breakdown))}" style="cursor:help"><div class="score-bar"><div class="bar"><div class="fill" style="width:${pct}%"></div></div><span class="val">${pct}%</span></div></td>
      <td class="hide-sm">${sofifa ? `<a class="ext" href="${sofifa}" target="_blank" rel="noopener">SoFIFA ↗</a>` : ''}</td>
    </tr>`;
  }).join('');
  const prof = [
    [tr('th_signings'), p.n],
    [tr('th_age'), p.age_mean?.toFixed(1) ?? '—'],
    [tr('th_fee'), fmt(p.fee_mean)],
    [tr('th_nat'), esc(countryName(p.nationality_mode) ?? '—')],
    [tr('th_league'), esc(p.from_league_mode ?? '—')],
    ...(team_overall != null ? [[tr('hdr_level'), team_overall]] : []),
  ].map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');

  return `<section class="card pos-section" id="pos-${esc(p.position_norm)}">
    <header class="pos-head">
      <span class="badge ${posBadge(p.position_norm, p.is_most_frequent)}"${p.is_most_frequent ? ` title="${tr('most_signed')}"` : ''}>${esc(p.position_norm)}</span>
      <dl class="pos-profile">${prof}</dl>
    </header>
    <div class="table-wrap"><table class="sortable">
      <thead>${thead('~>#', 'th_name', '~th_club', '~th_nat', '>th_age', '>th_value', '>OVR', '>POT', '>Score', '~')}</thead>
      <tbody>${rows}</tbody>
    </table></div>
  </section>`;
}

applyI18n();
init();
</script>
</body>
</html>
